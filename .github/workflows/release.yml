name: Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r test

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm -r exec -- pnpm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: pnpm -r build

      - name: Publish @specsync/sdk
        working-directory: packages/sdk
        run: npm publish --provenance --access public

      - name: Publish @specsync/server
        working-directory: packages/server
        run: npm publish --provenance --access public

  publish-docker:
    name: Push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hjgraca/specsync:latest
            ghcr.io/hjgraca/specsync:${{ steps.version.outputs.version }}

  update-changelog:
    name: Update CHANGELOG.md
    needs: [publish-npm, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          DATE=$(date -u +%Y-%m-%d)
          ENTRY="## ${VERSION} (${DATE})"

          # Skip if this version is already in the changelog
          if grep -qF "$ENTRY" CHANGELOG.md; then
            echo "Version ${VERSION} already in CHANGELOG.md, skipping"
            exit 0
          fi

          # Convert release body from markdown to changelog format
          # Strip HTML tags, keep markdown structure
          BODY=$(echo "$RELEASE_BODY" | sed 's/<[^>]*>//g' | sed '/^$/N;/^\n$/d')

          # Insert new entry after the header lines (line 5, after the semver link line)
          HEADER_END=5
          {
            head -n "$HEADER_END" CHANGELOG.md
            echo ""
            echo "$ENTRY"
            echo ""
            echo "$BODY"
            tail -n +"$((HEADER_END + 1))" CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update CHANGELOG.md for ${RELEASE_TAG}"
          git push
